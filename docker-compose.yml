services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beatbox
      POSTGRES_PASSWORD: beatbox
      POSTGRES_DB: beatbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beatbox"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://beatbox:beatbox@db:5432/beatbox
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
    ports:
      - "4000:4000"
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  appdata:
